<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Things to do</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
         :root {
            --blue: #2339C8;
            --deep: #17227A;
            --paper: #ECE7FF;
            --ink: #14122B;
            --stamp: #FF6A3D;
            --mint: #B8F2D0
        }
        
        * {
            box-sizing: border-box
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--blue);
            color: var(--ink);
            font: 400 1rem/1.5 "Instrument Sans", system-ui, sans-serif;
            background-image: radial-gradient(var(--deep) 1.5px, transparent 1.5px);
            background-size: 22px 22px
        }
        
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 3rem 1.25rem 4rem
        }
        
        h1 {
            font: 800 clamp(2.6rem, 10vw, 4.5rem)/.95 "Bricolage Grotesque", sans-serif;
            color: var(--paper);
            margin: 0 0 .5rem;
            letter-spacing: -.03em
        }
        
        .sub {
            color: var(--mint);
            margin: 0 0 2rem
        }
        
        form {
            display: flex;
            gap: .5rem;
            margin-bottom: 1.25rem
        }
        
        input[type=text] {
            flex: 1;
            min-width: 0;
            padding: .9rem 1rem;
            border: 3px solid var(--ink);
            border-radius: 6px;
            background: var(--paper);
            font: inherit;
            color: var(--ink)
        }
        
        button {
            font: 600 1rem "Instrument Sans", sans-serif;
            cursor: pointer;
            border: 3px solid var(--ink);
            border-radius: 6px;
            background: var(--mint);
            color: var(--ink);
            padding: .7rem 1.1rem
        }
        
        button:hover {
            background: #fff
        }
        
        :focus-visible {
            outline: 3px solid var(--stamp);
            outline-offset: 2px
        }
        
        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem;
            margin-bottom: 1rem;
            color: var(--paper)
        }
        
        .filters {
            display: flex;
            gap: .4rem
        }
        
        .filters button {
            background: transparent;
            color: var(--paper);
            border-color: var(--paper);
            padding: .3rem .8rem
        }
        
        .filters button[aria-pressed=true] {
            background: var(--paper);
            color: var(--ink)
        }
        
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: .9rem
        }
        
        li {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--paper);
            padding: 1.1rem 1.6rem;
            -webkit-mask: radial-gradient(circle 10px at 0 50%, #0000 97%, #000) left/51% 100% no-repeat, radial-gradient(circle 10px at 100% 50%, #0000 97%, #000) right/51% 100% no-repeat;
            mask: radial-gradient(circle 10px at 0 50%, #0000 97%, #000) left/51% 100% no-repeat, radial-gradient(circle 10px at 100% 50%, #0000 97%, #000) right/51% 100% no-repeat;
            animation: in .25s ease-out
        }
        
        li::before {
            content: "";
            position: absolute;
            left: 3.3rem;
            top: 12px;
            bottom: 12px;
            border-left: 2px dashed #b9b0e8
        }
        
        .check {
            width: 1.6rem;
            height: 1.6rem;
            accent-color: var(--stamp);
            flex: none;
            cursor: pointer
        }
        
        .txt {
            flex: 1;
            padding-left: 1rem;
            font-weight: 600;
            overflow-wrap: anywhere
        }
        
        li.done .txt {
            color: #7b76a0;
            text-decoration: line-through
        }
        
        li.done::after {
            content: "Done";
            position: absolute;
            right: 4rem;
            top: 50%;
            transform: translateY(-50%) rotate(-8deg);
            font: 800 1.5rem "Bricolage Grotesque", sans-serif;
            color: var(--stamp);
            border: 3px solid var(--stamp);
            border-radius: 6px;
            padding: 0 .5rem;
            opacity: .85;
            animation: stamp .25s ease-out
        }
        
        .del {
            background: transparent;
            border: 0;
            font-size: 1.3rem;
            padding: .2rem .5rem;
            color: var(--ink)
        }
        
        .del:hover {
            background: transparent;
            color: var(--stamp)
        }
        
        .empty {
            color: var(--paper);
            text-align: center;
            padding: 2rem 0
        }
        
        .clear {
            background: transparent;
            color: var(--paper);
            border-color: var(--paper);
            padding: .3rem .8rem
        }
        
        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
        }
        
        @keyframes stamp {
            from {
                transform: translateY(-50%) rotate(-8deg) scale(1.8);
                opacity: 0
            }
        }
        
        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none!important
            }
        }
        
        @media (max-width:480px) {
            li.done::after {
                right: 3rem;
                font-size: 1.1rem
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Things to do</h1>
        <p class="sub">Tick a task to stamp it done.</p>
        <form id="form">
            <input type="text" id="input" placeholder="What needs doing?" aria-label="New task" maxlength="120" required>
            <button type="submit">Add task</button>
        </form>
        <div class="bar">
            <span id="count"></span>
            <div class="filters" role="group" aria-label="Filter tasks">
                <button data-f="all" aria-pressed="true">All</button>
                <button data-f="open" aria-pressed="false">Open</button>
                <button data-f="done" aria-pressed="false">Done</button>
            </div>
            <button class="clear" id="clear">Clear done</button>
        </div>
        <ul id="list"></ul>
        <p class="empty" id="empty" hidden></p>
    </main>
    <script>
        const KEY = "things-to-do";
        let tasks = [],
            filter = "all";
        try {
            tasks = JSON.parse(localStorage.getItem(KEY)) || [];
        } catch (e) {}
        const $ = id => document.getElementById(id);
        const save = () => {
            try {
                localStorage.setItem(KEY, JSON.stringify(tasks));
            } catch (e) {}
        };

        function render() {
            const list = $("list");
            list.replaceChildren();
            const shown = tasks.filter(t => filter === "all" || (filter === "done") === t.done);
            shown.forEach(t => {
                const li = document.createElement("li");
                if (t.done) li.className = "done";
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.className = "check";
                cb.checked = t.done;
                cb.setAttribute("aria-label", "Mark done: " + t.text);
                cb.onchange = () => {
                    t.done = cb.checked;
                    save();
                    render();
                };
                const sp = document.createElement("span");
                sp.className = "txt";
                sp.textContent = t.text;
                const del = document.createElement("button");
                del.className = "del";
                del.textContent = "✕";
                del.setAttribute("aria-label", "Delete: " + t.text);
                del.onclick = () => {
                    tasks = tasks.filter(x => x !== t);
                    save();
                    render();
                };
                li.append(cb, sp, del);
                list.append(li);
            });
            const open = tasks.filter(t => !t.done).length;
            $("count").textContent = open + " open, " + (tasks.length - open) + " done";
            const empty = $("empty");
            empty.hidden = shown.length > 0;
            empty.textContent = tasks.length ? "Nothing in this view." : "No tasks yet. Add your first one above.";
        }

        $("form").onsubmit = e => {
            e.preventDefault();
            const v = $("input").value.trim();
            if (!v) return;
            tasks.unshift({
                text: v,
                done: false
            });
            $("input").value = "";
            save();
            render();
        };
        document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
            filter = b.dataset.f;
            document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
            render();
        });
        $("clear").onclick = () => {
            tasks = tasks.filter(t => !t.done);
            save();
            render();
        };
        render();
    </script>
</body>

</html>
